name: Publish

on:
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      release-ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint && yarn typecheck && yarn build && yarn test --ci
      # Install the pkg.pr.new GitHub app on this repository first.
      - name: Publish PR snapshot
        run: npx --yes pkg-pr-new@0.0.54 publish --no-compact

  release:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-ref }}
          persist-credentials: false
      # No registry-url: Yarn 1 cannot resolve an unset NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: npm install -g npm@11
      - run: yarn install --frozen-lockfile
      - run: yarn lint && yarn typecheck && yarn build && yarn test --ci
      - name: Publish version to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=beta; fi
          npm publish --access public --ignore-scripts --tag "$TAG"
