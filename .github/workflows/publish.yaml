name: Publish

on:
  push:
    branches:
      - master
      - develop

# Required for npm Trusted Publishing (OIDC). `id-token: write` lets the job mint the
# short-lived OIDC token npm exchanges for publish rights, and enables provenance attestations.
# No NPM_TOKEN secret is used anymore.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing requires npm >= 11.5.1; Node 20 ships an older npm, so upgrade it.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test --ci

      - name: Resolve context
        id: ctx
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # A prerelease version (e.g. 1.0.0-beta.3) cannot be published to "latest"; use its
          # prerelease label (e.g. "beta") as the dist-tag. A stable version (1.0.0) -> "latest".
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"     # beta.3
            TAG="${PRE%%.*}"        # beta
          else
            TAG="latest"
          fi
          echo "branch=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # master -> publish to the version's dist-tag ("latest" for stable, e.g. "beta" for a prerelease).
      # Auth is via OIDC (trusted publisher); provenance is attached automatically.
      - name: Publish
        if: steps.ctx.outputs.branch == 'master'
        run: npm publish --access public --ignore-scripts --tag "${{ steps.ctx.outputs.tag }}"

      # develop -> publish a per-commit release candidate under a custom dist-tag.
      - name: Make snapshot version
        if: steps.ctx.outputs.branch != 'master'
        run: npm version prerelease --preid=${{ steps.ctx.outputs.short_sha }} --git-tag-version false

      - name: Publish (release candidate)
        if: steps.ctx.outputs.branch != 'master'
        run: npm publish --access public --ignore-scripts --tag "$(echo "develop-${{ steps.ctx.outputs.version }}-rc" | sed 's/[.]//g')"
