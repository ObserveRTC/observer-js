name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to publish, without v (for example 1.3.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Finalize version and changelog
        id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/prepare-release.cjs
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - run: yarn lint && yarn typecheck && yarn build && yarn test --ci
      - name: Commit and tag release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git commit -m "chore: release $RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push --atomic origin HEAD:master "v$RELEASE_VERSION"

  publish:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yaml
    with:
      release-ref: ${{ needs.prepare.outputs.tag }}

  release:
    needs: [prepare, publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Extract release notes
        run: node scripts/prepare-release.cjs --notes
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          FLAGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md "${FLAGS[@]}"
